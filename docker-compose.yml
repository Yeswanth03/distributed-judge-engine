# Local development stack: every service, behind the gateway.
#   docker compose up -d --build
#   Gateway (the only entry point): http://localhost:8000
#   RabbitMQ UI: http://localhost:15672 (judge / judge)
# The first start downloads the AI model (about 4.7 GB) into the ollama-models volume; until then AI feedback
# waits. Ports already in use on your machine: override them in .env (POSTGRES_PORT, CATALOG_PORT, ...).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Set POSTGRES_PORT in .env if something else on your machine already uses 5432.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.1-management
    container_name: judge-engine-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./deploy/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./deploy/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10

  submission-service:
    build: ./services/submission-service
    environment:
      DATABASE_URL: postgres://submission:submission@postgres:5432/submission?sslmode=disable
      AMQP_URL: amqp://judge:judge@rabbitmq:5672/
      # Lets a frontend dev server on another port call the API directly (no gateway locally).
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    ports:
      # 8082 on the host: Catalog uses 8080 when run from the IDE.
      - "${SUBMISSION_PORT:-8082}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/server", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  # AI Feedback Service (services/ai-service): turns failed verdicts into LLM feedback. The gateway
  # routes /api/v1/ai/* here.
  ai-service:
    build: ./services/ai-service
    environment:
      AI_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ai_feedback
      AI_RABBITMQ_URL: amqp://judge:judge@rabbitmq:5672/
      AI_SUBMISSION_BASE_URL: http://submission-service:8080
      AI_CATALOG_BASE_URL: ${AI_CATALOG_BASE_URL:-http://catalog:8080}
      AI_INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-dev-token}
      # Ollama in Compose by default. On a Mac, Docker has no GPU access, so generation is
      # faster with the Ollama app running natively: AI_OLLAMA_BASE_URL=http://host.docker.internal:11434
      AI_OLLAMA_BASE_URL: ${AI_OLLAMA_BASE_URL:-http://ollama:11434}
      AI_OLLAMA_MODEL: ${AI_OLLAMA_MODEL:-qwen2.5-coder:7b}
    ports:
      - "${AI_SERVICE_PORT:-8084}:8084"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach services on your machine (Linux; built in on Mac)
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      submission-service:
        condition: service_healthy
      catalog:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8084/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # Local LLM server for the AI service. Models are kept in the ollama-models volume, so the
  # model is downloaded once, not on every start.
  ollama:
    image: ollama/ollama:0.5.7
    # Capped so generation can't starve the judge workers and sandboxes of CPU (Docker Desktop has 10).
    cpus: 4
    mem_limit: 8g
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11435}:11434"   # 11435 on the host, so it never clashes with a native Ollama app
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-off: downloads the AI service's model into the ollama volume (about 4.7 GB the first
  # time, then a quick check), and exits. The AI service starts after it succeeds.
  ollama-pull:
    image: ollama/ollama:0.5.7
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${AI_OLLAMA_MODEL:-qwen2.5-coder:7b}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  user-service:
    build: ./services/user-service
    environment:
      DATABASE_URL: postgres://users:users@postgres:5432/users?sslmode=disable
      AMQP_URL: amqp://judge:judge@rabbitmq:5672/
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      # Local development only: the first admin. Change the password after signing in.
      BOOTSTRAP_ADMIN_EMAIL: admin@example.com
      BOOTSTRAP_ADMIN_USERNAME: admin
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-admin-local-only}
      # Sign in with Google / GitHub: set these in your own .env (never committed). Unset means disabled.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
    ports:
      # 8085 on the host: 8080-8084 are Catalog, Spawner, Submission Service, Judge Worker and AI Service.
      - "${USER_SERVICE_PORT:-8085}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/server", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  catalog:
    build: ./services/catalog
    environment:
      # The local profile, pointed at this stack; it also seeds five sample problems on first start.
      DB_URL: jdbc:postgresql://postgres:5432/catalog
      DB_USER: postgres
      DB_PASSWORD: postgres
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: judge
      RABBITMQ_PASSWORD: judge
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-dev-token}
    ports:
      # Set CATALOG_PORT in .env when you also run Catalog from the IDE on 8080.
      - "${CATALOG_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  # Runs submissions in sandbox containers. It mounts the Docker socket, which is root-equivalent on the host:
  # only the Spawner gets it, it has no route through the gateway, and sandboxes run with no network.
  spawner:
    build: ./services/spawner
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${SPAWNER_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The worker pool's minimum of 2. Scale with: docker compose up -d --scale judge-worker=N
  # The metrics port (8083) isn't published: Prometheus reaches each replica over this network.
  judge-worker:
    build: ./services/judge-worker
    deploy:
      replicas: 2
    environment:
      JUDGE_RABBITMQ_URL: amqp://judge:judge@rabbitmq:5672/
      JUDGE_CATALOG_BASE_URL: http://catalog:8080
      JUDGE_SPAWNER_BASE_URL: http://spawner:8081
      JUDGE_INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-dev-token}
    depends_on:
      rabbitmq:
        condition: service_healthy
      catalog:
        condition: service_healthy
      spawner:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8083/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The only entry point from outside: verifies access tokens and routes to the services
  # (deploy/gateway/envoy.yaml). The services' own ports stay published for local debugging only.
  gateway:
    image: envoyproxy/envoy:v1.39.6
    command: ["envoy", "-c", "/etc/envoy/envoy.yaml", "--log-level", "warn"]
    volumes:
      - ./deploy/gateway/envoy.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    depends_on:
      user-service:
        condition: service_healthy
      submission-service:
        condition: service_healthy

  # Observability: Prometheus scrapes each service's /metrics, Grafana shows the dashboards
  # (deploy/prometheus, deploy/grafana). Grafana: http://localhost:3000, opens on the AI service dashboard.
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach services running on your machine (Linux; built in on Mac)

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      # Local development only: anyone can view; sign in as admin to edit.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin-local-only}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ai-service.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus

volumes:
  postgres-data:
  ollama-models:
