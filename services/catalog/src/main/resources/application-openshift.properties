# OpenShift. Activate with SPRING_PROFILES_ACTIVE=openshift.
# No fallback values on purpose: if a variable is missing (e.g. a Secret is not mounted), startup fails
# instead of quietly running with local settings.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

catalog.internal-token=${INTERNAL_SERVICE_TOKEN}

# Liveness and readiness endpoints for the pod's probes: /actuator/health/liveness and /actuator/health/readiness.
management.endpoint.health.probes.enabled=true
