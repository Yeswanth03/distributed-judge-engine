spring:
  application:
    name: catalog
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/catalog}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:change-me}
  jackson:
    # Contract rule for every service: JSON field names are snake_case.
    property-naming-strategy: SNAKE_CASE

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true

catalog:
  # Shared secret the judge presents on /internal/** calls. Keep it out of anything a submission can reach.
  internal-token: ${INTERNAL_SERVICE_TOKEN:change-me}
