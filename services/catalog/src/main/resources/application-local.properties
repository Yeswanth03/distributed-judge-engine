# Laptop development. Defaults work out of the box; override any of them with the environment variable.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/catalog}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Not a secret: only valid on your own machine.
catalog.internal-token=${INTERNAL_SERVICE_TOKEN:local-dev-token}

# RabbitMQ (broker defaults).
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
