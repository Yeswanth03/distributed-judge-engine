
spring.profiles.default=local

spring.application.name=catalog

# Contract rule for every service: JSON field names are snake_case.
spring.jackson.property-naming-strategy=SNAKE_CASE

server.port=8080

management.endpoints.web.exposure.include=health,prometheus

# Swagger UI at /swagger-ui.html, OpenAPI document at /v3/api-docs.
# Keep the Authorize value (X-User-Role) across page reloads, and open every endpoint ready to execute.
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.display-request-duration=true
# Document only the responses declared on each endpoint, not every exception handler on every endpoint.
springdoc.override-with-generic-response=false
